<style>
:root{--bg:#f4f1ea;--card:#ffffff;--ink:#0f1f2b;--mut:#55636d;--pri:#0f5560;--ps:#e2eeec;--ln:#ddd8cb;--red:#b42318;--grn:#13744a;--amb:#fbf0d3;--al:#94670f;--on:#fff;--gold:#c9973a;--sh:0 1px 2px rgba(15,31,43,.06),0 14px 34px -18px rgba(15,31,43,.28);--ease:cubic-bezier(.22,1,.36,1);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1315;--card:#122025;--ink:#eaf3f1;--mut:#9bb0b3;--pri:#52d0c0;--ps:#18312f;--ln:#27403f;--red:#ff9a90;--grn:#7ae0a5;--amb:#3a2e12;--al:#e6b04a;--on:#04201d;--gold:#e6b04a;--sh:0 1px 2px rgba(0,0,0,.4),0 16px 36px -18px rgba(0,0,0,.7);color-scheme:dark}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 "Atkinson Hyperlegible","Noto Sans Malayalam",system-ui,sans-serif}
h1{font-size:1.8rem;line-height:1.2;margin:4px 0}h2{font-size:1.25rem;margin:0 0 8px}p{margin:6px 0}.mut{color:var(--mut)}.err{color:var(--red);font-weight:700}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;background:var(--pri);color:var(--on)}header b{font-size:1.35rem}header .row>*{flex:0 0 auto}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;max-width:900px;margin:0 auto}
main,.home{max-width:900px;margin:0 auto;padding:12px 16px 120px;display:grid;gap:16px}
.card{background:var(--card);border:2px solid var(--ln);border-radius:18px;padding:18px}.card.warn{border-color:var(--al);background:var(--amb)}.card.ok{border-color:var(--grn)}
.b{font:inherit;font-weight:700;min-height:50px;padding:10px 18px;border-radius:12px;border:2px solid var(--pri);background:var(--pri);color:var(--on);cursor:pointer;transition:transform .15s,filter .15s}
.b:hover{filter:brightness(1.1)}.b:active{transform:scale(.96)}.b.ghost{background:transparent;color:var(--pri)}.b.grn{background:var(--grn);border-color:var(--grn);color:var(--on)}.b.red{background:var(--red);border-color:var(--red);color:var(--on)}
.b.sm{min-height:40px;padding:4px 12px}.b.big{display:block;width:100%;font-size:1.5rem;padding:20px;margin:10px 0}.b[disabled]{opacity:.5;cursor:not-allowed}
.c{font:inherit;font-weight:700;white-space:nowrap;padding:8px 16px;border-radius:99px;border:2px solid var(--ln);background:var(--card);color:var(--ink);cursor:pointer;transition:background .2s}.c.a{background:var(--pri);border-color:var(--pri);color:var(--on)}
.b:focus-visible,.c:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid var(--al);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:2px solid var(--mut);border-radius:10px;background:var(--card);color:var(--ink)}label{display:block;font-weight:700;margin:10px 0 2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 150px}
.it{padding:10px 0;border-top:1px solid var(--ln);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.it>*{flex:1 1 230px}
.pill{display:inline-block;margin:2px 4px 2px 0;padding:1px 12px;border-radius:99px;background:var(--ps);color:var(--pri);font-weight:700;font-size:.88rem}.pill.w{background:var(--amb);color:var(--ink);border:1px solid var(--al)}.pill.g{background:var(--grn);color:var(--on)}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:8px 0}.st div{background:var(--ps);border-radius:12px;padding:10px;color:var(--mut)}.st b{display:block;font-size:1.4rem;color:var(--ink)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:6px;border-top:1px solid var(--ln)}
.hero{background:linear-gradient(135deg,#0b4a6b,#0e7c6b);color:#fff;border-radius:24px;padding:32px;position:relative;overflow:hidden}.hero>*{position:relative}.hero p{opacity:.92}
.blob{position:absolute!important;border-radius:50%;background:rgba(255,255,255,.1);animation:fl 8s ease-in-out infinite}
.home .g2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chips span{background:rgba(255,255,255,.18);padding:6px 14px;border-radius:99px;font-weight:700}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.how .card b{font-size:1.1rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.t{font:inherit;font-weight:700;border:2px solid var(--ln);background:var(--card);color:var(--ink);border-radius:16px;padding:16px 8px;cursor:pointer;transition:transform .2s,border-color .2s}.t:hover{transform:translateY(-3px)}.t.on{border-color:var(--pri);background:var(--ps)}.t i{display:block;font-style:normal;font-size:2rem}
ol.sp,ol.ch{counter-reset:s;list-style:none;padding:0;margin:12px 0;display:grid;gap:6px;text-align:center;font-size:.82rem}ol.sp{grid-template-columns:repeat(5,1fr)}ol.ch{grid-template-columns:repeat(4,1fr)}
ol li::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:34px;height:34px;margin:0 auto 4px;border-radius:50%;background:var(--ps);color:var(--mut);font-weight:700;transition:background .5s}
ol.sp li.on::before{background:var(--grn);color:var(--on);content:"✓";animation:pop .4s}ol.sp li.wt::before{background:var(--al);color:#241800;animation:pulse 1.6s infinite}ol.ch li.on::before{background:var(--red);color:var(--on);animation:pop .4s}
.wtx{color:var(--al);font-weight:700}.gtx{color:var(--grn);font-weight:700}ul.tl{margin:6px 0;padding-left:20px;color:var(--mut);font-size:.95rem}
.sosf{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:88px;height:88px;border-radius:50%;border:0;background:var(--red);color:var(--on);font:700 1.3rem "Atkinson Hyperlegible",sans-serif;cursor:pointer;animation:ring 2s infinite;z-index:5}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:20px;z-index:9;animation:fade .2s}.ov .card{text-align:center;max-width:380px;width:100%}.cd{font-size:5rem;font-weight:700;color:var(--red);animation:pop .5s infinite alternate}
.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;z-index:8;animation:fade .3s}
svg.fp{width:84px;height:84px;color:var(--mut);display:block;margin:6px auto;overflow:hidden;border-radius:12px}svg.fp .sl{fill:var(--pri);opacity:0}.fp.scan{color:var(--pri)}.fp.scan .sl{opacity:1;animation:scan 1s linear infinite}.fp.done{color:var(--grn)}
.plan.on{border-color:var(--grn);background:var(--ps)}
.adm{border-color:#1b2a36;background:linear-gradient(160deg,#10202b,#1b3a4f);color:#fff}.adm label,.adm h2,.adm p{color:#fff}.adm input{border-color:#5b7385}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.rl{font:inherit;font-weight:700;text-align:center;border:2px solid var(--ln);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 6px;cursor:pointer;transition:transform .2s,border-color .2s}.rl i{display:block;font-style:normal;font-size:1.6rem}.rl small{display:block;font-weight:400;color:var(--mut);font-size:.75rem}.rl.on{border-color:var(--pri);background:var(--ps);transform:translateY(-3px)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--pri);color:var(--on);flex:0 0 44px}.ac{display:flex;gap:12px;align-items:center}
.demo button{font:inherit;display:block;width:100%;text-align:left;background:var(--ps);color:var(--ink);border:0;border-radius:10px;padding:8px 12px;margin:6px 0;cursor:pointer;transition:transform .15s}.demo button:hover{transform:translateX(4px)}
.hg{font-size:3.5rem;display:block;animation:sw 2s ease-in-out infinite}@keyframes sw{50%{transform:rotate(180deg)}}
.bar{height:8px;border-radius:99px;background:var(--ps);overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;width:40%;background:var(--al);border-radius:99px;animation:sl 2s ease-in-out infinite}@keyframes sl{0%{margin-left:-40%}100%{margin-left:100%}}
main.in>*{animation:up .45s both}main.in>*:nth-child(2){animation-delay:.07s}main.in>*:nth-child(3){animation-delay:.14s}main.in>*:nth-child(4){animation-delay:.21s}
@keyframes up{from{opacity:0;transform:translateY(16px)}}@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(201,138,0,.25)}}@keyframes ring{0%{box-shadow:0 0 0 0 rgba(179,38,30,.55)}100%{box-shadow:0 0 0 26px rgba(179,38,30,0)}}
@keyframes fl{50%{transform:translateY(-18px) scale(1.06)}}@keyframes scan{from{transform:translateY(0)}to{transform:translateY(84px)}}
@media (max-width:760px){.home .g2{grid-template-columns:1fr}ol.sp,ol.ch{font-size:.7rem}h1{font-size:1.5rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html{scroll-behavior:smooth}a.c{text-decoration:none;display:inline-block}a.c:focus-visible,header a.hl:focus-visible{outline:4px solid var(--al);outline-offset:2px}
header a.hl{color:var(--on);font-weight:700;text-decoration:none;padding:6px 10px;border-radius:8px}header a.hl:hover{background:rgba(255,255,255,.18)}
.ov .card.pay{text-align:left;max-width:460px;max-height:92vh;overflow:auto}.pay .cn{text-align:center}
.sum{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--ps);padding:10px 14px;border-radius:12px;margin:8px 0}
.bk{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:6px 0}.bk .t{padding:12px 6px;font-size:.95rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:8px 0}.kv dt{color:var(--mut)}.kv dd{margin:0;font-weight:700;word-break:break-word}
.spin{width:54px;height:54px;border:6px solid var(--ps);border-top-color:var(--pri);border-radius:50%;margin:14px auto;animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.tick{font-size:4rem;line-height:1;color:var(--grn);animation:pop .4s}.opt{font-weight:400;color:var(--mut)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
/* ===== Premium layer: depth, glass, motion, touch ===== */
body{background:radial-gradient(1100px 560px at 90% -8%,color-mix(in srgb,var(--gold) 16%,transparent),transparent 62%),radial-gradient(900px 520px at -8% 6%,color-mix(in srgb,var(--pri) 13%,transparent),transparent 60%),var(--bg);background-attachment:fixed;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
h1,h2{letter-spacing:-.012em}h2{font-size:1.3rem}
header{position:sticky;top:0;z-index:7;background:color-mix(in srgb,var(--pri) 92%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);box-shadow:0 10px 30px -18px rgba(0,0,0,.55);border-bottom:1px solid rgba(255,255,255,.14)}
header>b{letter-spacing:.01em;display:flex;align-items:center;gap:8px}header>b::first-letter{color:var(--gold)}
nav{scrollbar-width:none;scroll-snap-type:x proximity}nav::-webkit-scrollbar{display:none}nav .c{scroll-snap-align:start}
.card{border:1.5px solid var(--ln);border-radius:22px;box-shadow:var(--sh);transition:transform .5s var(--ease),box-shadow .5s var(--ease),border-color .3s,background .3s}
.how .card:hover,.plan:hover{transform:translateY(-5px);box-shadow:0 2px 4px rgba(15,31,43,.08),0 28px 46px -20px rgba(15,31,43,.38)}
.st div{border:1px solid color-mix(in srgb,var(--pri) 14%,transparent);transition:transform .4s var(--ease),background .3s}.st div:hover{transform:translateY(-3px)}.st b{font-variant-numeric:tabular-nums}
.b{border-radius:15px;border-color:transparent;background:linear-gradient(180deg,color-mix(in srgb,var(--pri) 86%,#fff),var(--pri));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 20px -10px color-mix(in srgb,var(--pri) 80%,transparent);transition:transform .35s var(--ease),box-shadow .35s var(--ease),filter .2s;will-change:transform;touch-action:manipulation}
.b:hover{filter:none;transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 16px 26px -10px color-mix(in srgb,var(--pri) 85%,transparent)}
.b:active{transform:scale(.965);transition-duration:.1s;box-shadow:inset 0 2px 6px rgba(0,0,0,.25)}
.b.ghost{background:transparent;border-color:var(--pri);box-shadow:none}.b.ghost:hover{background:var(--ps)}
.b.grn{background:linear-gradient(180deg,color-mix(in srgb,var(--grn) 84%,#fff),var(--grn));border-color:transparent}.b.red{background:linear-gradient(180deg,color-mix(in srgb,var(--red) 84%,#fff),var(--red));border-color:transparent}
.c{transition:background .3s var(--ease),color .3s,transform .3s var(--ease),box-shadow .3s}.c:hover{transform:translateY(-1px)}.c:active{transform:scale(.95)}.c.a{box-shadow:0 8px 16px -8px color-mix(in srgb,var(--pri) 80%,transparent)}
.t,.rl{box-shadow:0 1px 2px rgba(15,31,43,.05);touch-action:manipulation}.t:active,.rl:active{transform:scale(.95)}.t.on,.rl.on{box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 20%,transparent),0 12px 22px -14px var(--pri)}
input,select,textarea{border-width:1.5px;transition:border-color .25s,box-shadow .25s,background .25s}input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 22%,transparent);outline:none}
.hero{background:radial-gradient(520px 280px at 92% 0%,rgba(201,151,58,.42),transparent 65%),radial-gradient(420px 260px at 0% 100%,rgba(82,208,192,.22),transparent 70%),linear-gradient(135deg,#0b3640 0%,#0f5560 52%,#157568 100%);box-shadow:0 30px 60px -30px rgba(11,54,64,.7);border:1px solid rgba(255,255,255,.12)}

.av{background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 80%,var(--gold)));box-shadow:0 8px 16px -8px var(--pri)}
.pill{border:1px solid color-mix(in srgb,var(--pri) 18%,transparent)}
.it{transition:background .3s}.it:hover{background:color-mix(in srgb,var(--ps) 45%,transparent)}

main.in>*{animation:rise .45s var(--ease) both}.home.in>*{animation:rise .5s var(--ease) both}

.ft .soc{display:flex;gap:8px;flex-wrap:wrap}.ft .soc a{padding:8px 16px;border-radius:99px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);font-weight:700;font-size:.92rem}.ft .soc a:hover{transform:translateY(-3px);background:rgba(255,255,255,.2);text-decoration:none}
.ft .sos{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:12px 16px}.ft .sos b{color:#ffb4ab}
.ft .bt{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.16);padding-top:16px;font-size:.88rem;opacity:.8}
@media (max-width:760px){.ft .cols{grid-template-columns:1fr}.home .g2{grid-template-columns:minmax(0,1fr)}}
textarea.imp{min-height:120px;font:.85rem/1.4 ui-monospace,Menlo,monospace}
@media (prefers-reduced-motion:reduce){.dot,.sk{animation:none}}
/* ===== v4: family chat, reminders ===== */
.chat{display:grid;gap:8px;max-height:280px;overflow:auto;margin:8px 0;padding:2px}
.bub{max-width:86%;padding:8px 12px;border-radius:16px;background:var(--ps);justify-self:start}
.bub.me{justify-self:end;background:var(--pri);color:var(--on)}
.bub.ok{border:2px solid var(--grn)}.bub.ping{border:2px dashed var(--al)}
.bub small{display:block;opacity:.75;font-size:.75rem}
.livest{display:flex;gap:12px;align-items:center}.livest .big{font-size:2.4rem;line-height:1}
.cin{display:flex;gap:8px}.cin input{flex:1}.cin .b{min-height:44px}
ol.ch{grid-template-columns:repeat(auto-fit,minmax(78px,1fr))}

V.vol.dash=()=>{const me=S.me,open=S.req.filter(r=>r.st=='open'&&(!r.to||r.to==me.id)),mine=S.req.filter(r=>r.v==me.name&&r.st!='done');
return `<div><h1>Hello, ${me.name.split(' ')[0]}</h1><p class="mut">${me.ok?'You are verified. Thank you for helping.':''}</p></div>${upCard(mine)}${S.esc>0&&reached('vol')&&me.ok&&me.bio&&me.free?`<section class="card warn"><h2>🚨 Urgent: ${esc(WHO().n)} needs help</h2><p>${esc(WHO().a)}. ${S.kind=='sos'?'They pressed SOS.':'They missed their check-in.'} Nobody has acknowledged yet.</p>${S.ack?`<p><b>✓ ${esc(S.ack)} acknowledged${S.ackAt?' at '+esc(S.ackAt):''}.</b></p>`:`<button class="b big red" onclick="A.ack('${esc(me.name)} (volunteer)')">I’m going now</button>`}</section>`:''}${me.bio?'':`<section class="card warn"><h2>Fingerprint verification needed</h2><p>Scan your fingerprint once to start accepting requests.</p>${fp(S.bio==1?'scan':'')}<button class="b" onclick="A.scanMe()">Scan fingerprint</button></section>`}
<section class="card ${me.free?'ok':''}"><h2>Your availability</h2><p>${me.free?'You are marked <b>free</b>. '+(me.fn||'')+'. Elders can see you and ask you directly.':'You are marked busy. Elders cannot ask you directly.'}</p>${me.free?'':`<label for="fu">I am free</label><select id="fu"><option>for the next hour</option><option>until this evening</option><option>all day today</option><option>this weekend</option></select>`}<button class="b big ${me.free?'ghost':'grn'}" ${me.bio?'':'disabled'} onclick="A.free()">${me.free?'I’m busy now':'I’m free to help'}</button></section>
<section class="card"><h2>Requests near you</h2>${open.map(r=>`<div class="it"><span><b>${r.t}</b> ${r.veh?pill('🚗 Vehicle needed','g'):''}${r.to?pill('Asked for you','g'):''}· ${esc(en(r.by))} · ${r.d} km away · ${r.w}<br><span class="mut">${r.n}</span></span><button class="b sm" ${me.ok&&me.bio?'':'disabled'} onclick="A.acc(${r.id})">Accept</button></div>`).join('')||'<p class="mut">No open requests right now.</p>'}</section>
<section class="card"><h2>My tasks</h2>${mine.map(r=>`<div class="it" style="display:block"><b>${r.t}</b> ${r.veh?pill('🚗 Vehicle needed','g'):''}for ${esc(en(r.by))}<div class="mut">${r.n}</div>${stp(r)}${r.st=='acc'?`<button class="b big" onclick="A.door(${r.id})">I’m at the door</button>`:r.st=='door'?otpv(r):`<button class="b big grn" onclick="A.fin(${r.id})">Mark completed</button>`}</div>`).join('')||'<p class="mut">No active tasks.</p>'}</section>`};
V.vol.prof=()=>{const m=S.me;return `<section class="card ${m.ok?'ok':'warn'}" style="text-align:center">${fp(m.bio?'done':'')}<h2>Biometric ID ${m.bio?'verified ✓':'missing'}</h2>${pill(m.ok?'Approved by admin':'Waiting for approval',m.ok?'g':'w')}</section><div class="st"><div><b>${m.trust||'New'}</b>Trust score</div><div><b>${m.done||0}</b>Tasks done</div></div>`+PF()};

alertCard()+escSet()+`<section class="card"><h2>Demo data</h2><p class="mut">Everything you do here is saved in this browser and survives a reload. Reset brings back the original demo data.</p><button class="b ghost" onclick="A.wipe()">Reset demo data</button></section>`;

V.admin.funds=()=>`<section class="card"><h2>Support requests</h2>${S.funds.map(f=>`<div class="it"><span><b>${f.n}</b> asks ₹${f.a}: ${f.w} ${pill(f.st,f.st=='pending'?'w':'')}</span>${f.st=='pending'?`<input id="u${f.id}" placeholder="How funds will be used" aria-label="Use of funds"><button class="b grn sm" onclick="A.fd(${f.id},1)">Approve</button><button class="b ghost sm" onclick="A.fd(${f.id},0)">Reject</button>`:''}</div>`).join('')}${err()}</section>${rcptCard()}${dhCard()}${trans()}`;
V.admin.fb=()=>{const fs=[['all','All'],['Feedback','Feedback'],['Complaint','Complaints'],['Safety report','Safety reports']],l=S.fb.filter(x=>S.ff=='all'||x.t==S.ff);
return `<section class="card"><h2>Feedback and complaints</h2><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">${fs.map(f=>`<button class="c ${S.ff==f[0]?'a':''}" onclick="S.ff='${f[0]}';go()">${f[1]} (${S.fb.filter(x=>f[0]=='all'||x.t==f[0]).length})</button>`).join('')}</div>${l.map(x=>`<div class="it"><span>${pill(x.t,x.t=='Feedback'?'':'w')}${x.ref?pill(x.ref):''}${x.ab?pill('About: '+x.ab,'w'):''}${pill({elder:'Elder',vol:'Volunteer',donor:'Donor'}[x.role]||'User')}<b>${x.by}</b> <span class="mut">${x.at||''}</span><br>${x.m}${x.vn?'<br><audio controls src="'+x.vn+'" style="width:100%"></audio>':''}</span>${x.st=='Open'?`<button class="b sm" onclick="A.res(${x.id})">Mark resolved</button>`:pill('Resolved','g')}</div>`).join('')||'<p class="mut">Nothing here.</p>'}</section>`};

V.admin.eld=()=>{const E=S.acc.filter(a=>a.role=='elder'),c=k=>E.filter(e=>k=='all'||e.st==k).length;
return `<section class="card"><h2>Elders on the platform</h2><div class="st"><div><b>${E.length}</b>Total elders</div><div><b>${c('ok')}</b>Checked in today</div><div><b>${c('late')}</b>Check-in pending</div><div><b>${c('alert')}</b>Needs attention</div><div><b>${E.filter(e=>e.plan!='free').length}</b>On paid plans</div></div>
<label for="eq">Search by name, place or age</label><input id="eq" type="search" value="${esc(S.eq)}" placeholder="e.g. Nellikuzhi" oninput="A.eq(this.value)"><div class="sw">${[['all','All'],['ok','Checked in'],['late','Pending'],['alert','Needs attention']].map(f=>`<button class="c ${S.ef==f[0]?'a':''}" onclick="A.ef('${f[0]}')">${f[1]} (${c(f[0])})</button>`).join('')}</div><div id="eld">${eldL()}</div></section>`};
V.admin.hosp=()=>`<section class="card"><h2>Hospital dataset</h2><div class="st"><div><b>${S.hosp.length}</b>Hospitals listed</div><div><b>${S.hosp.filter(h=>h.ph).length}</b>With phone</div><div><b>${new Set(S.hosp.map(h=>h.k)).size}</b>Categories</div></div><p class="mut">Source: <b>${esc(S.hsrc)}</b>. ${S.hsrc=='Hospital dataset'?'This is the built-in dataset. Import a new file below to replace it.':'Elders see these hospitals, sorted by distance.'}</p></section>
<section class="card"><h2>Import your dataset</h2><p class="mut">Upload or paste a CSV (or JSON array) with columns like <b>name, type, place, lat, lng, phone, er</b>. Only name is required. Add lat and lng to get distances.</p><label for="hf">Choose a CSV or JSON file</label><input id="hf" type="file" accept=".csv,.json,.txt" onchange="A.hfile(this)"><label for="imp">Or paste it here</label><textarea id="imp" class="imp" oninput="S.f.imp=this.value" placeholder="name,type,place,lat,lng,phone,er">${esc(S.f.imp||'')}</textarea>${err()}<button class="b big" onclick="A.himp()">Import hospitals</button>${S.hsrc=='Hospital dataset'?'':'<button class="b big ghost" onclick="A.hreset()">Restore default dataset</button>'}</section>
<section class="card"><h2>Preview</h2>${S.hosp.slice(0,10).map(h=>`<div class="it" style="display:block"><b>${esc(h.n)}</b> ${pill(esc(h.k))}<div class="mut">${esc(h.ad||h.p||'')}</div><div class="mut">📞 ${esc(h.ph||'—')} · ✉️ ${esc(h.em||'—')}</div></div>`).join('')}${S.hosp.length>10?`<p class="mut">+ ${S.hosp.length-10} more</p>`:''}</section>`;
const pend=()=>`<header><b>♥ CareConnect</b><button class="b ghost sm" style="color:var(--on);border-color:var(--on)" onclick="A.out()">Log out</button></header><main class="in"><section class="card warn" style="text-align:center"><span class="hg">⏳</span><h1>Waiting for admin approval</h1><p>Hello, ${S.me.name}. Your ${S.me.role=='vol'?'volunteer':'donor'} access is not active yet. An admin must approve <b>${S.me.email}</b> first.</p><div class="bar"><i></i></div><p class="mut">Log in again after approval to open your page.</p></section></main>`;
/* ---------- Footer (edit CONTACT to use your real details) ---------- */
const CONTACT={addr:'Kothamangalam, Ernakulam, Kerala, India',phone:'+91 98767 89776',email:'hello@careconnect.demo',insta:'_____s_a_t_h_y_a____',whatsapp:'919037048119',waMsg:'Hello CareConnect! I would like some help.',facebook:'',youtube:'',hours:'Admin desk: 8 AM to 8 PM, every day'};
const foot=()=>{const C=CONTACT,r=S.me&&S.me.ok?S.me.role:'',links=S.me&&S.me.ok?NAV[r].map(n=>`<li><a href="#${n[0]}">${t(n[1])}</a></li>`).join(''):`<li><a href="#how">${t('How it works')}</a></li><li><a href="#login" onclick="A.sm('login')">${t('Log in')}</a></li><li><a href="#login" onclick="A.sm('reg')">${t('Sign up')}</a></li>`,
so=[['Instagram',C.insta&&'https://instagram.com/'+C.insta],['WhatsApp',C.whatsapp&&'https://wa.me/'+C.whatsapp.replace(/\D/g,'')+'?text='+encodeURIComponent(C.waMsg)],['Facebook',C.facebook&&'https://facebook.com/'+C.facebook],['YouTube',C.youtube&&'https://youtube.com/@'+C.youtube]].filter(x=>x[1]);
return `<footer class="ft ${r=='elder'?'el':''}"><div class="in2"><div class="cols"><div><div class="br"><span>♥</span> CareConnect</div><h3 style="margin-top:14px">${t('About us')}</h3><p>${L()?'ഒറ്റയ്ക്ക് താമസിക്കുന്ന മുതിർന്നവരെ പരിശോധിച്ച അയൽക്കാരുമായും സന്നദ്ധപ്രവർത്തകരുമായും ബന്ധിപ്പിക്കുന്ന ഒരു കമ്മ്യൂണിറ്റി പ്ലാറ്റ്ഫോം.':'A community platform that connects elders living alone with verified neighbours and volunteers for daily errands, hospital visits and instant help, and keeps families in the loop from anywhere.'}</p></div>
<div><h3>${t('Quick links')}</h3><ul>${links}</ul></div>
<div><h3>${t('Contact')}</h3><div class="ct"><div><i>📍</i><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(C.addr)}" target="_blank" rel="noopener">${esc(C.addr)}</a></div><div><i>📞</i><a href="tel:${esc(C.phone.replace(/[^\d+]/g,''))}">${esc(C.phone)}</a></div><div><i>✉️</i><a href="mailto:${esc(C.email)}">${esc(C.email)}</a></div><div><i>🕘</i><span>${esc(C.hours)}</span></div></div></div></div>
${so.length?`<div><h3>${t('Follow us')}</h3><div class="soc">${so.map(x=>`<a href="${esc(x[1])}" target="_blank" rel="noopener">${x[0]}</a>`).join('')}</div></div>`:''}
<div class="sos"><span>🚨 <b>${t('In an emergency')}</b></span><a href="tel:108">${t('Ambulance')} 108</a><a href="tel:112">${t('Emergency')} 112</a></div>
<div class="bt"><span>© ${new Date().getFullYear()} CareConnect. ${t('Living alone, never alone.')}</span><span>${L()?'ഇത് ഒരു ഡെമോ പ്രോട്ടോടൈപ്പ് ആണ്.':'Demo prototype. Payments are simulated.'}</span></div></div></footer>`};
/* ---------- Shell ---------- */
function shell(){const r=S.me.role;if(!S.me.ok)return pend();
return `<header><b>♥ CareConnect</b><div class="row"><span>${S.me.name}</span>${lang()}<button class="b ghost sm" style="color:var(--on);border-color:var(--on)" onclick="A.theme()">${t('Light / dark')}</button><button class="b ghost sm" style="color:var(--on);border-color:var(--on)" onclick="A.out()">${t('Log out')}</button></div></header>
<nav aria-label="Sections">${NAV[r].map(n=>`<a class="c ${S.tab==n[0]?'a':''}" href="#${n[0]}" ${S.tab==n[0]?'aria-current="page"':''}>${t(n[1])}</a>`).join('')}</nav>
<main class="${S.anim?'in':''}">${nfBar()}${(V[r][S.tab]||V[r].dash)()}</main>${foot()}
${r=='elder'?'<button class="sosf" onclick="A.sos()" aria-label="Emergency SOS">SOS</button>':''}
${S.py?payM():''}
${S.cd>0?`<div class="ov" role="alertdialog"><div class="card"><h2>${t('Sending SOS')}</h2><div class="cd">${S.cd}</div><p class="mut">${t('Your contacts, family and nearby volunteers will be alerted.')}</p><button class="b big ghost" onclick="A.cancel()">${t('Cancel, I pressed by mistake')}</button></div></div>`:''}
${S.toast?`<div class="toast" role="status">${S.toast}</div>`:''}`}
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const polish=()=>{const h=$('.home');if(h)h.classList.add('in');$$('main.in>*,.home.in>*').forEach((e,i)=>e.style.animationDelay=Math.min(i,6)*40+'ms');if(RM)return;$$('.st b').forEach(b=>{const x=b.textContent.trim(),n=+x;if(Number.isInteger(n)&&n>0&&x===String(n)){const t0=performance.now();(function f(now){const p=Math.min(1,(now-t0)/600);b.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}})};
function go(a){document.documentElement.lang=L()?'ml':'en';S.anim=a;$('#app').innerHTML=S.me?shell():home();{const c=$('.chat');if(c)c.scrollTop=c.scrollHeight}if(a)polish();save()}
const toast=m=>{S.toast=t(m);go();clearTimeout(tt);tt=setTimeout(()=>{S.toast='';soft()},2200)};

/* ---------- Actions ---------- */
A.theme=()=>{const d=document.documentElement,dk=d.dataset.theme?d.dataset.theme=='dark':matchMedia('(prefers-color-scheme: dark)').matches;d.dataset.theme=dk?'light':'dark';try{localStorage.setItem('cc_theme',d.dataset.theme)}catch(e){}};
A.portal=p=>{S.portal=p;S.mode='login';S.f={};S.msg='';S.bio=0;go()};A.mode=()=>{S.mode=S.mode=='reg'?'login':'reg';S.f={};S.msg='';go()};
A.login=()=>{const a=S.acc.find(a=>a.email==(S.f.email||'').trim().toLowerCase()&&a.pw==S.f.pw);if(!a){S.msg=t('Wrong email or password.');return go()}if(S.adm&&a.role!='admin'){S.msg='This email does not have admin access.';return go()}if(!S.adm&&a.role=='admin'){S.msg='Admins must use “Sign in as admin” below.';return go()}S.me=a;land();S.f={};S.msg='';go(1)};
A.scan=()=>{S.bio=1;go();setTimeout(()=>{S.bio=2;go()},2000)};
A.scanMe=()=>{S.bio=1;go();setTimeout(()=>{S.bio=0;S.me.bio=1;go()},2000)};

   ONE source of truth: the server requires this file, and the app (public/index.html) has the same code inlined.
   It works on a plain state object, so it runs identically on the server and in the browser (offline demo mode). */
(function (root, f) { if (typeof module === 'object' && module.exports) module.exports = f(); else root.ESC = f(); })(typeof self !== 'undefined' ? self : this, function () {

  function build(st, el) {
    const people = (st.people || []).filter(p => p.ok && (p.of || 'ammini') == el.id);
    const fams = (st.acc || []).filter(a => a.role == 'family' && a.of == el.id), used = new Set(), ct = [];

      const f = fams.find(a => D(a.phone) && D(a.phone) == D(p.ph));
      if (f) used.add(f.id);
      ct.push({ n: p.n, ph: p.ph || '', key: f ? 'fam:' + el.id : '', tok: tok() });
    });

    ch.push({ k: 'vol' }, { k: 'admin' }, { k: '112' });

  function notify(st, i) {
    const s = st.ch[i], w = who(st), sec = st.escSec || 60, ah = (st.ah || []).find(x => x.id == st.alId), loc = ah && ah.loc;
    const base = (st.kind == 'sos' ? '🆘 SOS from ' : '⚠ Missed check-in: ') + w.n + (w.a ? ' · ' + w.a : '') + (loc ? ' · live location shared' : '');
    const wait = i < st.ch.length - 1, tail = wait ? ' Waiting ' + sec + 's for an acknowledgement.' : '';
    if (s.k == 'contact') {
      const c = s.c;
      if (c.key) push(st, { to: c.key, msg: base + ' · please acknowledge', urgent: 1 });
      if (real(c.ph)) push(st, { to: 'sms', ph: c.ph, msg: base + '. Please confirm you are on the way:', tok: c.tok, sms: 1 });
      lg(st, 'Alerted ' + c.n + '.' + tail);
    } else if (s.k == 'vol') {
      const v = (st.acc || []).filter(a => a.role == 'vol' && a.ok && a.bio && a.free);
      push(st, { to: 'vol', msg: base + ' · welfare check needed', urgent: 1 });
      v.forEach(a => { if (real(a.phone)) push(st, { to: 'sms', ph: a.phone, msg: base + '. Please help if you can.', sms: 1 }); });

    } else if (s.k == 'admin') {
      push(st, { to: 'admin', msg: '🚨 No one has acknowledged the alert for ' + w.n + '.', urgent: 1 });

    el = el || (st.acc || []).find(a => a.id == 'ammini') || { id: 'ammini', name: 'Ammini Amma' };

    st.ch = b.ch; st.who = { id: el.id, n: el.name, a: el.addr || '', p: el.phone || '' }; st.alId = nid();

    lg(st, kind == 'sos' ? 'SOS pressed.' : 'Check-in missed.');
    if (b.fams.length && !(b.ch[0].k == 'contact' && b.ch[0].c.key)) { push(st, { to: 'fam:' + el.id, msg: msg + ' · tap “I’m responding” if you are on it' }); lg(st, 'Family updated: ' + b.fams.map(a => a.name).join(', ') + '.'); }

  /* Move to the next person only when time is up AND nobody has acknowledged. */
  function step(st, t) {

  }
